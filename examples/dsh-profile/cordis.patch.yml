# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# Wigolo bridge: free keyless web search provider, fetch_page & research_topic tools.
- id: web
  config:
    searchProvider: wigolo

# Demo 插件（profile 内本地源码，依赖从 profile/node_modules 解析）
- insert:
    - id: demo-tool
      name: './plugins/demo-tool/src/index.js'
      config:
        greeting: 'One'
        simulateLatency: false

# Disabled: conflicts with SandboxBashExecutor (both register "shell" service).
# Managed by dsh-plugin-hub. Remove this row to return control to higher-level configuration.
- id: pwsh-sandbox
  disabled: true

# dsh-plugin-preflight: 安装预检闸（自动劫持市场路由 + 自动巡检）
- insert:
    - id: preflight
      name: './plugins/dsh-plugin-preflight/src/index.js'

# Wigolo search provider: 免费无 key 本地搜索（通过 wigolo CLI）
- insert:
    - id: dsh-web-search-wigolo
      name: './plugins/dsh-web-search-wigolo/src/index.js'
